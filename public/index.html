<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="theme-color" content="#000000" />

  <!-- SEO Meta Tags -->
  <meta name="description" content="Find the latest job openings in Noida, Pune, Bengaluru at RGJobs. Full-time and internship positions available. Start your career today!" />
  <meta name="keywords" content="latest jobs, job updates, jobs in Noida, jobs in Pune, jobs in Bengaluru, internships, full-time jobs, RGJobs" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Latest Job Openings | RGJobs" />
  <meta property="og:description" content="Explore job openings and internships in top cities like Noida, Pune, and Bengaluru at RGJobs." />
  <meta property="og:image" content="%PUBLIC_URL%/favicon.ico" />
  <meta property="og:url" content="https://www.rgjobs.in" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Latest Job Openings | RGJobs" />
  <meta name="twitter:description" content="Explore job opportunities in Noida, Pune, and Bengaluru at RGJobs." />
  <meta name="twitter:image" content="%PUBLIC_URL%/favicon.ico" />

  <!-- Structured Data for Multiple Job Postings -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "WebPage",
      "name": "Latest Job Openings | RGJobs",
      "description": "Find the latest job openings in Noida, Pune, Bengaluru at RGJobs.",
      "url": "https://www.rgjobs.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.rgjobs.in/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "hasPart": [
        {
          "@type": "JobPosting",
          "title": "Software Developer - Bengaluru",
          "description": "Join a leading tech company in Bengaluru as a Software Developer. Full-time position with great benefits.",
          "hiringOrganization": {
            "@type": "Organization",
            "name": "RGJobs",
            "sameAs": "https://www.rgjobs.in"
          },
          "jobLocation": {
            "@type": "Place",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Bengaluru",
              "addressRegion": "Karnataka",
              "postalCode": "587315",
              "addressCountry": "IN"
            }
          }
        },
        {
          "@type": "JobPosting",
          "title": "Marketing Intern - Noida",
          "description": "Exciting internship opportunity in Noida for aspiring marketers. Gain hands-on experience!",
          "hiringOrganization": {
            "@type": "Organization",
            "name": "RGJobs",
            "sameAs": "https://www.rgjobs.in"
          },
          "jobLocation": {
            "@type": "Place",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Noida",
              "addressRegion": "UP",
              "postalCode": "201301",
              "addressCountry": "IN"
            }
          }
        }
      ]
    }
  </script>
