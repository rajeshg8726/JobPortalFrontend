<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%PUBLIC_URL%/rglogo.png" />
    <meta name="theme-color" content="#000000" />
    
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Find the latest job openings in Noida, Pune, Bengaluru at RGJobs. Full-time and internship positions available. Start your career today with top opportunities!"
      data-rh="true"
      />
    <meta 
      name="keywords" 
      content="latest jobs, job updates, jobs in Noida, jobs in Pune, jobs in Bengaluru, internships, full-time jobs, career opportunities, RGJobs"
    />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Latest Job Openings | RGJobs" />
    <meta property="og:description" content="Explore the latest job openings and internships in top cities like Noida, Pune, and Bengaluru at RGJobs." />
    <meta property="og:image" content="%PUBLIC_URL%/rglogo.png" />
    <meta property="og:url" content="https://rgjobs.in" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Latest Job Openings | RGJobs" />
    <meta name="twitter:description" content="Explore job opportunities in top cities like Noida, Pune, and Bengaluru." />
    <meta name="twitter:image" content="%PUBLIC_URL%/rglogo.png" />
    
    <!-- Structured Data for Job Posting -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "JobPosting",
        "title": "Software Developer - Bengaluru, Noida",
        "description": "RGJobs offers the latest job updates. Find full-time and internship positions in Noida, Pune, and Bengaluru.",
        "hiringOrganization": {
          "@type": "Organization",
          "name": "RGJobs",
          "sameAs": "https://rgjobs.in"
        },
        "jobLocation": {
          "@type": "Place",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Bengaluru,Noida",
            "addressRegion": "Karnataka,UP",
            "postalCode": "	587315,201301",
            "addressCountry": "IN"
          }
        }
      }
    </script>

    <meta name="google-site-verification" content="cMXxHXt8iDBLnyGweMvFDeotRL46bZ5KIVkFUEA2Mew" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- External CSS & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-QsHKx4eWgHVg3rbdWBwfLw46+gueSiBQ8ONCY/+zXNqZgsaMhXnDJxWb0T8WmWiqKsTLzTsyHdBlD2sMdZznJA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link href="https://rgjobs.in" rel="canonical" />

    <title>Latest Job Openings | RGJobs</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</html>
